name: Shopkeep
description: >-
  ShopKeep was a cloud-based iPad point-of-sale (POS) platform for independent
  retailers, restaurants, and quick-serve businesses, offering register,
  inventory, employee management, payments, and analytics. Founded in 2008 and
  backed by Canaan Partners, ShopKeep was acquired by Lightspeed Commerce in
  2020 and its product and brand have since been folded into the Lightspeed
  Retail (S-Series) line. The marketing domain shopkeep.com now redirects to
  lightspeedhq.com/shopkeep, and support has migrated to
  shopkeep-support.lightspeedhq.com. ShopKeep never shipped a publicly
  documented developer API — a private "API beta" existed circa 2015 and the
  app backend at api.shopkeep.com remains live as a session-authenticated,
  undocumented internal service. No public OpenAPI, SDKs, developer portal, or
  API reference are published, so this profile is identity-only.
